name: Daily Expense Reminder

on:
  schedule:
    - cron: "0 20 * * *" # 8 PM UTC daily
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily reminder endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/daily-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
